global:
  # 5 секунд вместо стандартных 15: в лабе нужны короткие всплески,
  # на редком опросе throttling просто не попадёт в выборку.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
