# Порог выселения по памяти. Две поправки против значений по умолчанию:
#
# 1. k3s вообще не задаёт сигнал memory.available, оставляя только дисковые.
#    Без него eviction по памяти не наступает никогда, и вместо kubelet
#    работает ядерный OOM-киллер — это другой механизм с другим диагнозом.
#
# 2. Значение подобрано под особенность k3d. Контейнер ноды читает
#    /proc/meminfo хоста и считает своей ёмкостью всю память виртуалки,
#    а рабочий набор — только по своей cgroup. Поэтому два kubelet
#    независимо насчитывают больше свободной памяти, чем есть на машине,
#    и привычные 100Mi или даже 4Gi здесь недостижимы. 7Gi — это порог
#    в системе координат самого kubelet, а не в координатах free.
kubelet-arg:
  - "eviction-hard=memory.available<7Gi,nodefs.available<5%,imagefs.available<5%"
  - "eviction-minimum-reclaim=memory.available=500Mi"
