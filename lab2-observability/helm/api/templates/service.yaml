apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  # NodePort, потому что порты 30000-30010 проброшены с хоста наружу:
  # так сервис доступен из браузера на Windows без port-forward.
  type: NodePort
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
