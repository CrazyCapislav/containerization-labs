# Loki в однобинарном режиме: для учебного кластера распределённая схема
# с отдельными ingester/querier/compactor избыточна и съедает память.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 48h
    # Логи из кластера приходят пачками с разным временем; без послаблений
    # Loki отбрасывает строки с меткой времени "из прошлого".
    reject_old_samples: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Компоненты распределённого режима не нужны.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

# Кэши выключены: на 8 ГБ памяти они только мешают.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Свой gateway не нужен, обращаемся к сервису Loki напрямую.
gateway:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
