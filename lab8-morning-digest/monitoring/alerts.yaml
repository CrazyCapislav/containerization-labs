# Три алерта для воркфлоу сводки по релизу.
#
# Выбор метрик определён тем, что триггер СОБЫТИЙНЫЙ: процесс запускается
# пушем тега, а не расписанием. Между релизами два дня без прогонов это
# норма, поэтому метрики вида "давно не было успешных прогонов" здесь
# негодны: они шумели бы почти всё время и их отключили бы через неделю.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kvart-release-digest
  namespace: monitoring
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: kvart-digest
    # Метка, по которой Prometheus из kube-prometheus-stack отбирает
    # правила: без неё объект создастся, но правила не загрузятся.
    release: kps
spec:
  groups:
    - name: kvart-release-digest
      rules:

        # 1. Громкий отказ. Прогон упал, значит release notes или задача
        #    с чек-листом не появились, хотя тег уже есть.
        #
        #    Порог ноль: прогонов мало и каждый значим, ждать второго
        #    падения смысла нет. Окно 15 минут: прогон длится около ста
        #    секунд и успевает попасть в метрику, а дежурный узнаёт
        #    о проблеме до выкатки.
        #
        #    Сброс счётчика при перезапуске n8n ложного срабатывания
        #    не даёт: increase учитывает сбросы. А вот ручная отмена
        #    прогона алерт поднимет: в n8n метка status принимает всего
        #    два значения, и canceled попадает в ту же метку failed.
        - alert: KvartDigestRunFailed
          expr: increase(n8n_workflow_execution_duration_seconds_count{status="failed"}[15m]) > 0
          labels:
            severity: critical
            service: kvart-release-digest
          annotations:
            summary: "Прогон сводки по релизу упал"
            description: >-
              За последние 15 минут завершился неудачей
              {{ $value | printf "%.0f" }} прогон(ов). Release notes или задача
              с чек-листом могли не появиться, хотя тег уже запушен.
              Проверить до выкатки.

        # 2. Тихий отказ. Для событийного триггера он выглядит так:
        #    тег запушен, а принять вебхук некому, и событие теряется.
        #    Отсутствие прогонов само по себе ничего не значит, значимо
        #    только то, что n8n недоступен в момент, когда событие может
        #    прийти.
        #
        #    Цена принята сознательно: up == 0 бывает и когда Prometheus
        #    не видит n8n из-за сети, а сам n8n жив. На этом стенде цель
        #    это вручную заданный объект Endpoints, и пересоздание сети
        #    k3d сделает его устаревшим. Проверить и закрыть такой алерт
        #    дежурному быстро.
        - alert: KvartDigestUnreachable
          expr: up{job="n8n-external"} == 0
          for: 5m
          labels:
            severity: critical
            service: kvart-release-digest
          annotations:
            summary: "n8n недоступен, вебхук на пуш тега принять некому"
            description: >-
              Цель n8n-external не отвечает 5 минут. Пуш тега в этот период
              не создаст ни release notes, ни задачу, и повторной доставки
              события не будет. Проверить также, не устарел ли объект
              Endpoints после пересоздания сети кластера.

        # 3. Деградация. Единственный из рассмотренных кандидатов, который
        #    описывает состояние "жив, но плохо" и прямо влияет на триггер:
        #    занятый цикл событий означает медленный ответ на вебхук, а
        #    GitHub ждёт ответа ограниченное время и при таймауте считает
        #    доставку неудачной. То есть это прямой предшественник
        #    тихого отказа, и алерт даёт время вмешаться раньше.
        #
        #    Порог взят как заведомо ненормальный для Node.js: в покое
        #    p50 на этом стенде равен 0.00076 секунды. Требует калибровки
        #    по фактическому p99 за несколько дней работы.
        - alert: KvartDigestEventLoopLag
          expr: n8n_nodejs_eventloop_lag_p99_seconds > 1
          for: 10m
          labels:
            severity: warning
            service: kvart-release-digest
          annotations:
            summary: "Цикл событий n8n перегружен"
            description: >-
              p99 задержки цикла событий {{ $value | printf "%.2f" }} с дольше
              10 минут. Результат пока приходит, но запас тает: при дальнейшем
              росте n8n не успеет ответить на вебхук, и событие потеряется.
              Разобраться в рабочее время, будить не нужно.
