# Общие метки проставляются всем объектам: их требует политика require-labels.
partOf: shop

# Селектор нод по умолчанию: применяется к компонентам, у которых нет своего.
# postgres обязан оставаться на рабочей ноде, потому что его том local-path
# физически лежит на её диске и переезд оставил бы под без данных.
nodeSelector:
  kubernetes.io/hostname: k3d-obs-agent-0

# Разнесение реплик по топологическим доменам (Часть 1 лабы 4).
# Чарт поддерживает оба механизма, выбор делает mode:
#   topologySpread — держит перекос между доменами в пределах maxSkew;
#   antiAffinity   — запрещает соседство, равномерность выразить не умеет;
#   none           — без разнесения.
spread:
  mode: topologySpread
  topologyKey: kubernetes.io/hostname
  # Только для topologySpread.
  maxSkew: 1
  whenUnsatisfiable: DoNotSchedule
  # Только для antiAffinity: required (жёстко) или preferred (мягко).
  strictness: preferred

# Классы приоритета (Часть 5 лабы 4). Приоритет решает две вещи: порядок
# обслуживания очереди Pending и то, кого вытеснят, когда места не хватает.
priorityClasses:
  enabled: true
  critical:
    name: shop-critical
    value: 1000000
  background:
    name: shop-background
    # Отрицательное значение ставит batch ниже подов вообще без класса:
    # отсутствие priorityClassName означает приоритет 0, а не «самый низкий».
    value: -1000

api:
  replicaCount: 3
  image:
    repository: shop-api
    tag: v4
    # Образы импортированы в ноды через k3d image import, во внешнем реестре их нет.
    pullPolicy: IfNotPresent
  version: "4"
  # Критический путь: вытесняет фоновую нагрузку, когда не хватает места.
  priorityClassName: shop-critical
  # Пустой селектор означает «любая нода». Разносить реплики можно только
  # тогда, когда у планировщика больше одного кандидата: отсев по
  # nodeSelector идёт раньше правил разнесения и обессмысливает их.
  nodeSelector: {}
  # Сколько секунд процесс продолжает обслуживать запросы после SIGTERM.
  # Нужно, чтобы правила маршрутизации на нодах успели убрать под из
  # балансировки раньше, чем он закроет сокет.
  shutdownDelaySeconds: 5
  # Бюджет добровольных нарушений: при drain ноды Kubernetes не опустит
  # число готовых реплик ниже этого порога. На вытеснение по приоритету
  # и на eviction по давлению ресурсов PDB не влияет.
  pdb:
    enabled: true
    minAvailable: 2
  # Должно быть заметно больше задержки, иначе Kubernetes убьёт под раньше.
  terminationGracePeriodSeconds: 25
  # Переключатель для Части 2 лабы 3: заставляет /health отвечать 503,
  # чтобы показать остановку выкатки сломанной версии.
  healthFail: false
  service:
    port: 8080
    nodePort: 30006
  # Числа из Части 3: krr дал 17m как 95-й перцентиль CPU и 100Mi по памяти
  # (память — его нижний порог mem-min, фактический максимум был 23.8Mi).
  # Запрос равен лимиту по обоим ресурсам: это и есть условие класса Guaranteed.
  # По CPU добавлен запас к перцентилю. Лимит ровно по p95 означал бы троттлинг
  # в оставшихся пяти процентах случаев, то есть именно на пиках, которые
  # SLA и обязан пережить. krr лимит CPU не советует вовсе — здесь мы идём
  # против его рекомендации сознательно, ради предсказуемого порядка вытеснения.
  resources:
    requests:
      cpu: 200m
      memory: 100Mi
    limits:
      # Часть 8 показала, почему 50m здесь было ошибкой. Лимит режет пики
      # внутри стомиллисекундного периода CFS: средняя загрузка может быть
      # 12m, но запрос, которому нужно 20 мс процессорного времени, в квоту
      # 5 мс за период не укладывается и ждёт следующего. Перцентиль годится
      # для requests, влияющих только на планирование; лимит задаётся по пику.
      cpu: 200m
      memory: 100Mi

worker:
  replicaCount: 2
  image:
    repository: shop-worker
    tag: v1
    pullPolicy: IfNotPresent
  version: "1"
  intervalSeconds: 5
  batchSize: 10
  service:
    port: 8081
  # Числа krr: 10m по CPU и 100Mi по памяти — оба его нижние пороги,
  # фактическое потребление меньше в разы. Лимит памяти оставлен выше
  # запроса: worker не на критическом пути, Guaranteed ему не нужен.
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 192Mi

# Заглушка «ночной аналитики» (Часть 0 лабы 4). Полезной работы не делает,
# нужна, чтобы создать управляемую нехватку ресурсов и показать, кого
# Kubernetes приносит в жертву первым.
batch:
  enabled: true
  # В Части 6 наращивается по шагам, пока кластер не перестанет всё вмещать.
  replicaCount: 3
  image:
    repository: shop-batch
    tag: v1
    pullPolicy: IfNotPresent
  # Пустой селектор: batch должен иметь возможность занять любую ноду,
  # иначе он не будет конкурировать с критическим путём за место.
  nodeSelector: {}
  # Состояния нет, соединений не держит — гасить можно сразу.
  terminationGracePeriodSeconds: 5
  # Ниже всех: вытесняется первым и сам никого не вытесняет.
  priorityClassName: shop-background
  service:
    port: 8080
  # Профиль нагрузки. Меняется через helm upgrade без пересборки образа:
  # это понадобится в Частях 6 и 7, где нагрузку наращивают постепенно.
  load:
    # Для Части 6 реальная нагрузка убрана почти в ноль, а запрос ниже
    # задран. Так планировщик считает ноды занятыми, хотя процессор на них
    # простаивает: именно этот разрыв между requests и фактом Часть 6
    # и должна показать. В Части 7 память здесь поднимут обратно.
    # Часть 7: память растёт постепенно, чтобы можно было наблюдать
    # приближение к порогу и успеть остановиться.
    # Профиль покоя. Фон есть, но машину не выжигает. Значения, которыми
    # создавалось давление в Частях 6, 7 и 8, расписаны в README лабы 4:
    # там же сказано, почему запрос и факт у batch намеренно расходятся.
    cpuWorkers: 1
    cpuDutyPercent: 30
    memMB: 128
    memGrowthMBPerSec: 0
    memMaxMB: 128
  # Запрос намеренно крупный: им мы занимаем место в расчётах планировщика.
  # Лимит памяти выше запроса — это и делает batch классом Burstable,
  # в отличие от Guaranteed у критического пути.
  # Лимит поднят намеренно: при низком потолке контейнер упёрся бы в свой
  # лимит и был бы убит ядром, не создав давления на ноду. Нам нужно другое —
  # чтобы он честно съел память машины. Запрос при этом остаётся крошечным,
  # и разрыв запрос/лимит делает его Burstable, то есть первой жертвой.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 2Gi

# Подключение к базе. Имя секрета соответствует тому, что создаёт
# CloudNativePG для кластера с именем postgres.cluster (Часть 3).
database:
  secretName: shop-db-app
  secretKey: uri

postgres:
  enabled: false
  # Имя объекта Cluster. Оператор создаёт секрет приложения с именем
  # <clusterName>-app, поэтому database.secretName должен ему соответствовать.
  clusterName: shop-db
  instances: 1
  priorityClassName: shop-critical
  database: shop
  owner: shop
  storageSize: 1Gi
  # krr базу не видит: её подом управляет напрямую объект Cluster оператора,
  # стандартного контроллера между ними нет. Числа посчитаны вручную по тем же
  # метрикам: максимум памяти за час 72Mi, 95-й перцентиль CPU 25m.
  # Памяти взято больше, чем дала бы формула krr: postgres выделяет work_mem
  # на каждую сортировку в момент запроса, и OOMKill базы стоит несопоставимо
  # дороже сотни зарезервированных мегабайт.
  resources:
    requests:
      cpu: 500m
      memory: 192Mi
    limits:
      # База оказалась настоящим узким местом Части 8: при лимите 50m у неё
      # обрезалось 99.7% периодов CFS, и каждый заказ ждал её. Поды при этом
      # были Running и Ready — ни одна проба такого не ловит.
      cpu: 500m
      memory: 192Mi

monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
  prometheusRule:
    enabled: false
  # Дашборд лабы 4. Едет ConfigMap-ом, который подхватывает sidecar Grafana.
  dashboard:
    enabled: true
