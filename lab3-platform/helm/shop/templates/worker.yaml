apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "shop.labels" (dict "name" "worker" "partOf" .Values.partOf "release" .Release.Name) | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "name" "worker" "release" .Release.Name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.labels" (dict "name" "worker" "partOf" .Values.partOf "release" .Release.Name) | nindent 8 }}
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.service.port }}
          env:
            - name: ADDR
              value: ":{{ .Values.worker.service.port }}"
            - name: APP_VERSION
              value: {{ .Values.worker.version | quote }}
            - name: INTERVAL_SECONDS
              value: {{ .Values.worker.intervalSeconds | quote }}
            - name: BATCH_SIZE
              value: {{ .Values.worker.batchSize | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "shop.labels" (dict "name" "worker" "partOf" .Values.partOf "release" .Release.Name) | nindent 4 }}
spec:
  # ClusterIP: наружу worker не нужен, сервис существует ради сбора метрик.
  type: ClusterIP
  selector:
    {{- include "shop.selectorLabels" (dict "name" "worker" "release" .Release.Name) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.worker.service.port }}
      targetPort: http
