{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "shop.labels" (dict "name" "shop" "partOf" .Values.partOf "release" .Release.Name) | nindent 4 }}
spec:
  # Один ServiceMonitor на оба сервиса: отбор идёт по общей метке part-of,
  # которую и так требует политика require-labels.
  selector:
    matchLabels:
      app.kubernetes.io/part-of: {{ .Values.partOf }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
---
{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "shop.labels" (dict "name" "shop" "partOf" .Values.partOf "release" .Release.Name) | nindent 4 }}
spec:
  groups:
    - name: shop.critical
      rules:
        # 1. База недоступна приложению.
        # Ловит то, чего Kubernetes не видит в принципе: пробы готовности
        # намеренно не зависят от базы, поэтому при её отказе поды остаются
        # Running и Ready, кластер считает всё исправным, а заказы не создаются.
        - alert: ShopDatabaseUnavailable
          expr: min(shop_db_up) == 0
          for: 1m
          labels:
            severity: critical
            service: shop
          annotations:
            summary: "Приложение shop не видит базу данных"
            description: "Метрика shop_db_up равна нулю минуту подряд хотя бы у одного пода."
            impact: "Заказы не создаются и не читаются: POST /order и GET /orders отвечают 503."
            action: "kubectl get cluster -n shop; смотреть состояние объекта CloudNativePG и логи оператора. Поды приложения при этом выглядят здоровыми, искать надо в базе."

        # 2. Очередь заказов растёт.
        # Признак того, что worker не справляется или встал. Сигнал бизнесовый,
        # а не инфраструктурный: все поды здоровы, а заказы не обрабатываются.
        - alert: ShopOrdersBacklogGrowing
          expr: max(shop_orders_pending) > 20
          for: 5m
          labels:
            severity: critical
            service: shop
          annotations:
            summary: "Накопилась очередь необработанных заказов"
            description: "Больше 20 заказов ждут обработки дольше пяти минут."
            impact: "Клиенты оформили заказы, но они не двигаются дальше по процессу."
            action: "Проверить worker: поднять replicaCount или уменьшить intervalSeconds. Если очередь растёт при работающем worker, искать замедление в базе."

        # 3. Worker жив, но не работает.
        # Процесс отвечает на пробы, Kubernetes доволен, а циклы обработки
        # не выполняются. Классический зависший воркер, которого не видно
        # ни по состоянию пода, ни по перезапускам.
        - alert: ShopWorkerStalled
          expr: |
            sum(rate(shop_worker_cycles_total[5m])) == 0
            and
            sum(up{job=~".*worker.*"}) > 0
          for: 5m
          labels:
            severity: critical
            service: shop
          annotations:
            summary: "Worker не выполняет циклы обработки"
            description: "Счётчик shop_worker_cycles_total не растёт пять минут, при этом поды worker отвечают на сбор метрик."
            impact: "Заказы не обрабатываются, хотя внешне всё исправно."
            action: "Посмотреть логи worker: вероятно, он завис на обращении к базе. Перезапуск пода вернёт обработку, но причину надо искать в логах."

    # Группа лабы 4: отказы, связанные с ресурсами и планированием.
    # Три разных механизма, каждый невидим для остальных двух.
    - name: shop.resources
      rules:
        # 1. Критический путь не может разместиться.
        # Планировщик считает по requests, а не по факту, поэтому Pending
        # возникает и на простаивающем кластере. Для batch это штатное
        # состояние и алертом не является: следим только за api и базой.
        - alert: ShopCriticalPodPending
          expr: sum(kube_pod_status_phase{namespace="shop",phase="Pending",pod=~"shop-api-.*|shop-db-.*"}) > 0
          for: 3m
          labels:
            severity: critical
            service: shop
          annotations:
            summary: "Под критического пути не может быть размещён"
            description: "Под api или базы висит в Pending дольше трёх минут."
            impact: "Ёмкость пути заказа ниже расчётной: оставшиеся реплики несут повышенную нагрузку."
            action: "kubectl describe pod покажет причину в событии FailedScheduling. Чаще всего Insufficient cpu: сумма requests превысила allocatable, при том что реальная загрузка может быть низкой."

        # 2. Критический путь режется троттлингом.
        # Самый коварный отказ из трёх: поды Running и Ready, перезапусков нет,
        # потребление в пределах лимита — и при этом сервис медленный. Процессор
        # сжимаем, его нехватка не убивает под, а добавляет задержку. Именно
        # этот алерт поймал бы аварию из Части 8, где лимит базы в 50m
        # обрезал 99.7% периодов, а статус подов оставался безупречным.
        - alert: ShopCriticalPathThrottled
          expr: |
            sum by (container) (rate(container_cpu_cfs_throttled_periods_total{namespace="shop",container=~"api|postgres"}[5m]))
            /
            sum by (container) (rate(container_cpu_cfs_periods_total{namespace="shop",container=~"api|postgres"}[5m]))
            > 0.1
          for: 5m
          labels:
            severity: critical
            service: shop
          annotations:
            summary: "Контейнер {{ `{{ $labels.container }}` }} режется процессорным лимитом"
            description: "Больше десятой части периодов CFS обрезается пять минут подряд."
            impact: "Задержка пути заказа растёт, хотя поды выглядят здоровыми и ничего не падает."
            action: "Поднять limits.cpu. Лимит надо задавать по пиковой потребности, а не по перцентилю: перцентиль годится для requests, которые влияют только на планирование."

        # 3. Нарушен сам SLA.
        # Два алерта выше ловят причины, этот — следствие. Нужен потому, что
        # причин деградации больше, чем мы предусмотрели, и симптом надо
        # сторожить независимо от известных механизмов.
        - alert: ShopOrderLatencySLOBreach
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="shop",path="/order"}[5m]))
            ) > 0.3
          for: 5m
          labels:
            severity: critical
            service: shop
          annotations:
            summary: "95-й перцентиль оформления заказа вышел за 300 мс"
            description: "SLA критического пути нарушен пять минут подряд."
            impact: "Клиенты ждут оформления заказа заметно дольше обещанного."
            action: "Сверить с ShopCriticalPathThrottled и ShopCriticalPodPending. Если оба молчат, причина вне ресурсов: смотреть базу и внешние зависимости."
{{- end }}
