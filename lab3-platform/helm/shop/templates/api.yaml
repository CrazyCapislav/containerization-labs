apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "shop.labels" (dict "name" "api" "partOf" .Values.partOf "release" .Release.Name) | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "name" "api" "release" .Release.Name) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Обновляем по одному поду и не опускаемся ниже полного состава:
      # так во время выкатки сервис продолжает отвечать без просадки.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "shop.labels" (dict "name" "api" "partOf" .Values.partOf "release" .Release.Name) | nindent 8 }}
        # Метка версии добавлена в шаблон пода, а не в селектор Deployment:
        # селектор неизменяем после создания, и его правка потребовала бы
        # пересоздания релиза.
        app.kubernetes.io/version: {{ .Values.api.version | quote }}
      {{- if .Values.api.mesh.enabled }}
      annotations:
        # Инжекция прокси включается на уровне пода, а не namespace:
        # mesh нужен только вокруг api, остальные сервисы shop остаются
        # вне его, и цена меша в Части 8 считается за один сервис.
        linkerd.io/inject: enabled
        {{- if .Values.api.mesh.nativeSidecar }}
        config.linkerd.io/proxy-enable-native-sidecar: "true"
        {{- end }}
        config.linkerd.io/proxy-cpu-request: {{ .Values.api.mesh.proxy.cpuRequest | quote }}
        config.linkerd.io/proxy-memory-request: {{ .Values.api.mesh.proxy.memoryRequest | quote }}
        config.linkerd.io/proxy-cpu-limit: {{ .Values.api.mesh.proxy.cpuLimit | quote }}
        config.linkerd.io/proxy-memory-limit: {{ .Values.api.mesh.proxy.memoryLimit | quote }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- if .Values.api.priorityClassName }}
      priorityClassName: {{ .Values.api.priorityClassName }}
      {{- end }}
      {{- $sel := ternary .Values.api.nodeSelector .Values.nodeSelector (hasKey .Values.api "nodeSelector") }}
      {{- if $sel }}
      nodeSelector:
        {{- toYaml $sel | nindent 8 }}
      {{- end }}
      {{- with include "shop.spread" (dict "name" "api" "release" .Release.Name "spread" .Values.spread) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          env:
            - name: ADDR
              value: ":{{ .Values.api.service.port }}"
            - name: APP_VERSION
              value: {{ .Values.api.version | quote }}
            - name: HEALTH_FAIL
              value: {{ .Values.api.healthFail | quote }}
            - name: FLAKY
              value: {{ .Values.api.flaky.enabled | quote }}
            - name: FLAKY_PERCENT
              value: {{ .Values.api.flaky.percent | quote }}
            - name: FAIL
              value: {{ .Values.api.fail | quote }}
            - name: SHUTDOWN_DELAY_SECONDS
              value: {{ .Values.api.shutdownDelaySeconds | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.postgres.enabled }}
            # Строку подключения берём из секрета, который создаёт оператор:
            # пароль генерируется им, в чарте его быть не должно.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  {{- if and .Values.api.mesh.enabled .Values.api.retry.enabled }}
  annotations:
    # Повторы настраиваются на СЕРВИСЕ, а не на поде: решение принимает
    # прокси отправителя, и ему нужно знать политику назначения.
    retry.linkerd.io/http: {{ .Values.api.retry.condition | quote }}
    retry.linkerd.io/limit: {{ .Values.api.retry.limit | quote }}
    retry.linkerd.io/timeout: {{ .Values.api.retry.timeout | quote }}
  {{- end }}
  labels:
    {{- include "shop.labels" (dict "name" "api" "partOf" .Values.partOf "release" .Release.Name) | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "shop.selectorLabels" (dict "name" "api" "release" .Release.Name) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      nodePort: {{ .Values.api.service.nodePort }}
