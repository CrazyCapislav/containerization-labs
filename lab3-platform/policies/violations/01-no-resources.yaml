# Нарушает require-resources: нет requests и limits.
# Остальным четырём правилам соответствует.
apiVersion: v1
kind: Pod
metadata:
  name: bad-no-resources
  namespace: shop
  labels:
    app.kubernetes.io/name: bad-no-resources
    app.kubernetes.io/part-of: shop
spec:
  containers:
    - name: app
      image: shop-api:v1
      readinessProbe:
        httpGet: { path: /health, port: 8080 }
        periodSeconds: 5
      livenessProbe:
        httpGet: { path: /health, port: 8080 }
        periodSeconds: 10
