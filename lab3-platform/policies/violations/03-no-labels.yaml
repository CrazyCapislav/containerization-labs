# Нарушает require-labels: нет обязательных меток.
apiVersion: v1
kind: Pod
metadata:
  name: bad-no-labels
  namespace: shop
spec:
  containers:
    - name: app
      image: shop-api:v1
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }
      readinessProbe:
        httpGet: { path: /health, port: 8080 }
        periodSeconds: 5
      livenessProbe:
        httpGet: { path: /health, port: 8080 }
        periodSeconds: 10
